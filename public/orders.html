<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ShopNaija Demo</title>
  <link rel="stylesheet" href="css/styles.css?v=4">
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Mandatory Fixed Educational Demo Banner -->
  <aside class="demo-banner" aria-label="Demo notice">
    <span class="demo-banner-badge">TRAINING LAB</span>
    <span>DEMO APP - FAKE DATA ONLY</span>
  </aside>

  <!-- Navigation Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-link">
        <span class="flag-dot"></span>
        <span>ShopNaija</span>
        <span class="brand-tag">Demo Store</span>
      </a>

      <nav aria-label="Primary navigation">
        <ul class="nav-links">
          <li><a href="orders.html" class="nav-link active">My Orders</a></li>
        </ul>
      </nav>

      <div class="nav-auth" id="nav-auth-container">
        <!-- Injected by auth.js -->
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">My Order History</h1>
      <p class="page-subtitle">Track your recent orders and delivery status.</p>
    </div>

    <div class="table-responsive">
      <table class="data-table" aria-label="Customer Orders Table">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Item</th>
            <th>Total Amount</th>
            <th>Status</th>
            <th>Placed On</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <!-- Injected dynamically by orders.js -->
        </tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <p>ShopNaija Cybersecurity Educational Demo &copy; 2026. Built strictly for defensive security training.</p>
  </footer>

  <script type="module">
    import { loadMyOrders } from './js/orders.js?v=4';
    document.addEventListener('DOMContentLoaded', loadMyOrders);
  </script>
</body>
</html>
