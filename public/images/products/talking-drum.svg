<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="drumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="woodDrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="drumShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#drumBg)"/>

  <!-- Hourglass Talking Drum (Gangan) -->
  <g filter="url(#drumShadow)">
    <!-- Top Drum Head (Leather Membrane) -->
    <ellipse cx="300" cy="150" rx="70" ry="22" fill="#fde68a" stroke="#78350f" stroke-width="3"/>
    <!-- Bottom Drum Head -->
    <ellipse cx="300" cy="310" rx="70" ry="22" fill="#fde68a" stroke="#78350f" stroke-width="3"/>
    <!-- Hourglass Body -->
    <path d="M240 155 Q290 230 280 230 Q290 230 240 305 L360 305 Q310 230 320 230 Q310 230 360 155 Z" fill="url(#woodDrum)"/>
    <!-- Tuning Leather Strings (Chords along waist) -->
    <line x1="245" y1="160" x2="280" y2="230" stroke="#fef3c7" stroke-width="2"/>
    <line x1="280" y1="230" x2="245" y2="300" stroke="#fef3c7" stroke-width="2"/>
    <line x1="270" y1="168" x2="295" y2="230" stroke="#fef3c7" stroke-width="2"/>
    <line x1="295" y1="230" x2="270" y2="295" stroke="#fef3c7" stroke-width="2"/>
    <line x1="330" y1="168" x2="305" y2="230" stroke="#fef3c7" stroke-width="2"/>
    <line x1="305" y1="230" x2="330" y2="295" stroke="#fef3c7" stroke-width="2"/>
    <line x1="355" y1="160" x2="320" y2="230" stroke="#fef3c7" stroke-width="2"/>
    <line x1="320" y1="230" x2="355" y2="300" stroke="#fef3c7" stroke-width="2"/>
    <!-- Curved Curved Striker Stick (Opa) -->
    <path d="M380 260 Q410 230 395 180" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="395" cy="180" r="10" fill="#78350f"/>
  </g>
  <rect x="180" y="395" width="240" height="30" rx="15" fill="rgba(0,0,0,0.6)" stroke="#b45309" stroke-width="1.5"/>
  <text x="300" y="415" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#fed7aa" text-anchor="middle" letter-spacing="1.5">TALKING DRUM (GANGAN)</text>
</svg>
