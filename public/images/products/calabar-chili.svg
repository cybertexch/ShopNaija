<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chiliBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0505"/>
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="jarShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#chiliBg)"/>

  <!-- Glass Jar of Chili Oil -->
  <g filter="url(#jarShadow)">
    <!-- Gold Lid -->
    <rect x="250" y="125" width="100" height="25" rx="5" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <rect x="255" y="118" width="90" height="8" rx="2" fill="#fef08a"/>
    <!-- Glass Jar Body -->
    <rect x="235" y="150" width="130" height="190" rx="18" fill="url(#oilGrad)"/>
    <!-- Crunchy flakes inside -->
    <circle cx="260" cy="270" r="5" fill="#fef08a" opacity="0.8"/>
    <circle cx="330" cy="285" r="7" fill="#450a0a"/>
    <circle cx="280" cy="300" r="6" fill="#fef08a" opacity="0.6"/>
    <circle cx="310" cy="315" r="4" fill="#b91c1c"/>
    <circle cx="340" cy="250" r="5" fill="#fef08a" opacity="0.7"/>
    <!-- Jar Label -->
    <rect x="245" y="180" width="110" height="75" rx="6" fill="#ffffff" opacity="0.95"/>
    <path d="M285 195 Q295 190 300 205 Q305 220 315 210" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="300" y="235" font-family="'Rubik', sans-serif" font-size="10" font-weight="800" fill="#991b1b" text-anchor="middle">CALABAR CHILI</text>
    <text x="300" y="248" font-family="'Nunito Sans', sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">HOT CRISP OIL • 250ml</text>
  </g>
  <rect x="180" y="395" width="240" height="30" rx="15" fill="rgba(0,0,0,0.6)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="300" y="415" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle" letter-spacing="1.5">CALABAR CHILI CRISP</text>
</svg>
