<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="leatherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <filter id="shoeShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#leatherBg)"/>

  <!-- Kano Leather Slippers (Half Shoes) -->
  <g filter="url(#shoeShadow)">
    <!-- Sole -->
    <path d="M190 280 C180 230 210 180 270 170 C310 165 330 210 320 270 C310 320 230 330 190 280 Z" fill="#431407"/>
    <!-- Upper Leather -->
    <path d="M195 240 C190 200 220 175 270 170 C305 168 315 200 310 240 Q250 215 195 240 Z" fill="url(#leatherGrad)"/>
    <!-- Stitching line -->
    <path d="M205 235 C205 205 230 185 270 180 C295 180 305 205 300 235" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" fill="none"/>

    <!-- Right Shoe (Angled Pair) -->
    <path d="M280 290 C270 240 300 190 360 180 C400 175 420 220 410 280 C400 330 320 340 280 290 Z" fill="#431407"/>
    <path d="M285 250 C280 210 310 185 360 180 C395 178 405 210 400 250 Q340 225 285 250 Z" fill="url(#leatherGrad)"/>
    <path d="M295 245 C295 215 320 195 360 190 C385 190 395 215 390 245" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  </g>
  <rect x="180" y="395" width="240" height="30" rx="15" fill="rgba(0,0,0,0.6)" stroke="#ea580c" stroke-width="1.5"/>
  <text x="300" y="415" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#fed7aa" text-anchor="middle" letter-spacing="1.5">KANO LEATHER CRAFT</text>
</svg>
