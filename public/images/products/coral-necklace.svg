<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="coralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="coralBead" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <filter id="necklaceGlow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#coralBg)"/>

  <!-- Velvet Jewelry Stand and Coral Necklace -->
  <g filter="url(#necklaceGlow)">
    <!-- Stand neck silhouette -->
    <path d="M220 330 C220 220 250 160 300 160 C350 160 380 220 380 330 Z" fill="#27272a"/>
    <!-- Outer Tier Beads (Royal Edo Coral) -->
    <circle cx="230" cy="240" r="12" fill="url(#coralBead)"/>
    <circle cx="245" cy="270" r="13" fill="url(#coralBead)"/>
    <circle cx="270" cy="295" r="14" fill="url(#coralBead)"/>
    <circle cx="300" cy="305" r="16" fill="url(#coralBead)"/>
    <circle cx="330" cy="295" r="14" fill="url(#coralBead)"/>
    <circle cx="355" cy="270" r="13" fill="url(#coralBead)"/>
    <circle cx="370" cy="240" r="12" fill="url(#coralBead)"/>
    <!-- Inner Choker Tier -->
    <circle cx="250" cy="210" r="9" fill="url(#coralBead)"/>
    <circle cx="270" cy="230" r="10" fill="url(#coralBead)"/>
    <circle cx="300" cy="240" r="11" fill="url(#coralBead)"/>
    <circle cx="330" cy="230" r="10" fill="url(#coralBead)"/>
    <circle cx="350" cy="210" r="9" fill="url(#coralBead)"/>
    <!-- Gold Accents -->
    <circle cx="300" cy="325" r="7" fill="#fbbf24"/>
  </g>
  <rect x="180" y="395" width="240" height="30" rx="15" fill="rgba(0,0,0,0.6)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="300" y="415" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle" letter-spacing="1.5">ROYAL EDO CORAL BEADS</text>
</svg>
