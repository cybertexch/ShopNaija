<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="spiceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="spiceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="jarShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#spiceBg)"/>

  <!-- Gourmet Spice Shaker Jar -->
  <g filter="url(#jarShadow)">
    <!-- Black Matte Lid -->
    <rect x="250" y="130" width="100" height="25" rx="5" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
    <!-- Glass Jar with Vibrant Red-Orange Seasoning -->
    <rect x="240" y="155" width="120" height="180" rx="14" fill="url(#spiceGrad)"/>
    <!-- Spice Granules Texture -->
    <circle cx="265" cy="180" r="3" fill="#fef08a" opacity="0.6"/>
    <circle cx="285" cy="200" r="2.5" fill="#450a0a" opacity="0.7"/>
    <circle cx="330" cy="190" r="3" fill="#fef08a" opacity="0.8"/>
    <circle cx="260" cy="300" r="4" fill="#b91c1c"/>
    <circle cx="320" cy="310" r="3.5" fill="#fef08a" opacity="0.7"/>
    <!-- Label -->
    <rect x="250" y="210" width="100" height="75" rx="6" fill="#18181b" stroke="#ea580c" stroke-width="1.5"/>
    <text x="300" y="235" font-family="'Rubik', sans-serif" font-size="10" font-weight="800" fill="#fb923c" text-anchor="middle">PARTY JOLLOF</text>
    <text x="300" y="250" font-family="'Nunito Sans', sans-serif" font-size="8" font-weight="700" fill="#e4e4e7" text-anchor="middle">SMOKEY SPICE BLEND</text>
    <text x="300" y="272" font-family="'Nunito Sans', sans-serif" font-size="9" font-weight="800" fill="#22c55e" text-anchor="middle">100% ORGANIC</text>
  </g>
  <rect x="180" y="395" width="240" height="30" rx="15" fill="rgba(0,0,0,0.6)" stroke="#ea580c" stroke-width="1.5"/>
  <text x="300" y="415" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#fed7aa" text-anchor="middle" letter-spacing="1.5">SMOKEY JOLLOF SPICE</text>
</svg>
