<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sleeveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <pattern id="ankaraPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f59e0b"/>
      <circle cx="20" cy="20" r="16" fill="#0284c7"/>
      <circle cx="20" cy="20" r="8" fill="#e11d48"/>
      <circle cx="0" cy="0" r="10" fill="#10b981"/>
      <circle cx="40" cy="40" r="10" fill="#10b981"/>
    </pattern>
    <filter id="sleeveShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#sleeveBg)"/>

  <!-- Laptop Sleeve -->
  <g filter="url(#sleeveShadow)">
    <!-- Sleeve Body -->
    <rect x="180" y="140" width="240" height="180" rx="16" fill="url(#ankaraPattern)" stroke="#18181b" stroke-width="4"/>
    <!-- Top Zipper Track -->
    <rect x="195" y="132" width="210" height="10" rx="3" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
    <circle cx="385" cy="137" r="6" fill="#f59e0b"/>
    <!-- Leather Brand Patch -->
    <rect x="250" y="260" width="100" height="35" rx="6" fill="#78350f" stroke="#fbbf24" stroke-width="1"/>
    <text x="300" y="282" font-family="'Rubik', sans-serif" font-size="9" font-weight="800" fill="#fef3c7" text-anchor="middle">SHOPNAIJA 15"</text>
  </g>
  <rect x="180" y="395" width="240" height="30" rx="15" fill="rgba(0,0,0,0.6)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="415" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle" letter-spacing="1.5">ANKARA LAPTOP SLEEVE</text>
</svg>
