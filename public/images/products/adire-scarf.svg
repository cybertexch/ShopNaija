<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="adireBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="indigoDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="5" fill="#38bdf8" opacity="0.4"/>
      <circle cx="15" cy="15" r="2" fill="#ffffff" opacity="0.8"/>
    </pattern>
    <filter id="silkShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#adireBg)"/>
  
  <!-- Flowing Silk Scarf Silhouette -->
  <g filter="url(#silkShadow)">
    <path d="M150 140 C220 80 320 220 450 130 C480 200 420 300 440 360 C320 310 260 380 160 330 C130 260 170 190 150 140 Z" fill="#1d4ed8"/>
    <path d="M165 155 C225 105 315 230 435 150 C460 210 405 295 425 345 C320 305 265 365 175 320 Z" fill="url(#indigoDots)"/>
    <!-- Fold Highlights -->
    <path d="M220 120 Q300 240 380 180" stroke="#93c5fd" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M200 240 Q310 320 400 260" stroke="#bfdbfe" stroke-width="3" fill="none" opacity="0.5"/>
  </g>
  <rect x="180" y="395" width="240" height="30" rx="15" fill="rgba(0,0,0,0.6)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="415" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#bae6fd" text-anchor="middle" letter-spacing="1.5">ORGANIC ADIRE INDIGO</text>
</svg>
