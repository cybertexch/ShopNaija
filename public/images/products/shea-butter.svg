<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sheaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="jarGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="tubShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#sheaBg)"/>

  <!-- Round Cosmetic Tub -->
  <g filter="url(#tubShadow)">
    <!-- Wooden / Bamboo Lid -->
    <ellipse cx="300" cy="180" rx="100" ry="25" fill="#b45309"/>
    <ellipse cx="300" cy="175" rx="98" ry="24" fill="#d97706"/>
    <!-- Tub Body -->
    <path d="M205 180 Q200 310 300 320 Q400 310 395 180 Z" fill="url(#jarGold)"/>
    <!-- Cream Swirl Indicator -->
    <ellipse cx="300" cy="225" rx="55" ry="14" fill="#ffffff" opacity="0.9"/>
    <text x="300" y="260" font-family="'Rubik', sans-serif" font-size="11" font-weight="800" fill="#78350f" text-anchor="middle">RAW NILOTICA</text>
    <text x="300" y="276" font-family="'Nunito Sans', sans-serif" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">PURE SHEA BUTTER</text>
    <text x="300" y="295" font-family="'Nunito Sans', sans-serif" font-size="8" font-weight="700" fill="#92400e" text-anchor="middle">GRADE A UNREFINED</text>
  </g>
  <rect x="180" y="395" width="240" height="30" rx="15" fill="rgba(0,0,0,0.6)" stroke="#15803d" stroke-width="1.5"/>
  <text x="300" y="415" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#86efac" text-anchor="middle" letter-spacing="1.5">ORGANIC SHEA BUTTER</text>
</svg>
